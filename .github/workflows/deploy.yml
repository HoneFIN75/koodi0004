name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Configure SSH Client
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          for variable in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required secret $variable is missing or empty."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if ! ssh-keyscan -T 10 -p 22 -H "$SSH_HOST" > ~/.ssh/known_hosts; then
            echo "::error::Failed to fetch SSH host keys for SSH_HOST."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::Fetched SSH host keys have no entry for SSH_HOST."
            exit 1
          fi

      - name: Ensure deployment path exists
        shell: bash
        run: |
          set -euo pipefail

          printf -v remote_path '%q' "$DEPLOY_PATH"

          ssh \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p -- $remote_path"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            -az \
            --protect-args \
            --delete \
            --exclude='jsondb/' \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deployment completed
        run: echo "Production deployment completed successfully."

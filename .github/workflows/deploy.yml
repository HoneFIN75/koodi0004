name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build application
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Configure SSH Client
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for variable in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required secret $variable is missing or empty."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure deployment path exists
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_path '%q' "$DEPLOY_PATH"
          for attempt in 1 2 3; do
            if ssh \
              -i ~/.ssh/id_rsa \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p -- $remote_path"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Unable to connect to the deployment host after 3 attempts."
              exit 1
            fi
            echo "::warning::SSH connection failed; retrying in $((attempt * 5)) seconds."
            sleep "$((attempt * 5))"
          done

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if rsync \
              -az \
              --protect-args \
              --delete \
              -e "ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30" \
              dist/ \
              "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Deployment transfer failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Deployment transfer failed; retrying in $((attempt * 5)) seconds."
            sleep "$((attempt * 5))"
          done

      - name: Deployment completed
        run: echo "Production deployment completed successfully."

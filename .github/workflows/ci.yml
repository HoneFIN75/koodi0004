name: Validate dashboard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: php -l server/planner.php
      - run: php -l server/clubs.php
      - run: php -l server/clubs-api.php
      - run: php -l server/migrate-clubs.php
      - run: php -l server/setup-auth.php
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  firefox-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - run: npx playwright test --project=firefox
